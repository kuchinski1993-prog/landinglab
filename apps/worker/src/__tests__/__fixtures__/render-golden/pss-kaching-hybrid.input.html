<!DOCTYPE html>
<html lang="en">
<head>
  <title>PSS Product Studio Minimal Fixture</title>
</head>
<body>
  <!-- PSS Gallery block (Product Studio slider) -->
  <div class="pss-gallery">
    <div class="pss-main-wrap">
      <div class="pss-main-slide is-active"><img src="/img/1.jpg" alt="Product 1"></div>
      <div class="pss-main-slide"><img src="/img/2.jpg" alt="Product 2"></div>
      <div class="pss-main-slide"><img src="/img/3.jpg" alt="Product 3"></div>
      <button class="pss-arrow pss-arrow-prev" aria-label="Previous">‹</button>
      <button class="pss-arrow pss-arrow-next" aria-label="Next">›</button>
    </div>
    <div class="pss-thumbs">
      <button class="pss-thumb is-active"><img src="/img/1-thumb.jpg" alt=""></button>
      <button class="pss-thumb"><img src="/img/2-thumb.jpg" alt=""></button>
      <button class="pss-thumb"><img src="/img/3-thumb.jpg" alt=""></button>
    </div>
  </div>

  <!-- PSS ATC (Add to Cart button do Product Studio) -->
  <button class="pss-atc-button" data-atc-button="1">Aggiungi al carrello</button>

  <!-- PSS Accordion (FAQ) -->
  <div class="pss-accordion">
    <button class="pss-accordion-trigger">Q1?</button>
    <div class="pss-accordion-panel">A1.</div>
  </div>

  <!-- Bundle cards (mesmo padrão Kaching que PSS herda) -->
  <div class="kaching-bundles__bar" data-deal-bar-id="p1">
    <span class="kaching-bundles__bar-price">$29.95</span>
    <span class="kaching-bundles__bar-full-price">$59.90</span>
  </div>
  <div class="kaching-bundles__bar" data-deal-bar-id="p2">
    <span class="kaching-bundles__bar-price">$59.90</span>
    <span class="kaching-bundles__bar-full-price">$119.80</span>
  </div>
</body>
</html>
